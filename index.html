<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanye West</title>
    <link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
  rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<body class = "h-screen grid grid-rows-[1.5fr_8fr_3.5fr_0.7fr] font-mono">
    <header class = "bg-linear-to-t from-[#141312] to-[#121211] px-15 flex items-center justify-between"> 
        <img class="h-fit" src="./assets/Ye logo.png" width="100" alt="">  
        <div class="navLinks text-[#d7d6d6] flex gap-17">
            <p class="hover:text-white hover:underline underline-offset-10 cursor-pointer">Home</p>
            <p class="hover:text-white hover:underline underline-offset-10 cursor-pointer">Music</p>
            <p class="hover:text-white hover:underline underline-offset-10 cursor-pointer">Legacy</p>
            <p class="hover:text-white hover:underline underline-offset-10 cursor-pointer">Gallery</p>
            <p class="hover:text-white hover:underline underline-offset-10 cursor-pointer">Contact</p>
        </div>
        <button class ="text-[#e0e0e0] border border-white px-7 py-3 rounded-4xl hover:text-white cursor-pointer">Listen Now <i class="ri-arrow-right-up-line"></i> </button>
    </header>
    <main class = "bg-linear-to-t from-[#141312] via-[#121212] to-[#141312] px-18 pt-5 grid grid-cols-[1fr_1.5fr_0.001fr_1fr] gap-5">
        <div class="texts flex flex-col gap-1 justify-center mb-10">
            <p class="text-[#A4A3A3] tracking-[0.2em]">IDEAS CHANGE EVERYTHING</p>
            <h1 class="text-white font-sans text-[12vh] text-left font-black tracking-[0.01em] leading-[0.8em] ">MORE<br>THAN<br>MUSIC
            </h1>
            <p class="text-[#A4A3A3] tracking-[0.1em] my-5">A vision beyond sound.<br>Art. Culture. Innovation.<br>Forever evolving.</p>

            <div class="buttons flex gap-5">
                <button class="bg-white rounded-4xl px-4 py-2 font-[800] cursor-pointer"> Explore The Journey <i class="ri-arrow-right-up-line"></i></button>
            <button class=" text-[#d7d6d6] px-4 py-2 font-[800] cursor-pointer"> <i class="ri-play-circle-line"></i> Play Intro</button>
            </div>
        </div>
        <div class="kanyeHero">
            <img src="./assets/kanyeWest.png" alt="">
        </div>
        <div class="h-[90%] bg-[#d7d6d6] mt-10"></div>
        <div class="audio flex flex-col items-center pt-10 gap-5">
            <img src="./assets/ghost twon.jpg" width="400" alt="">
            <audio src="./assets/Ghost Town.mp3" autoplay controls class="w-100 "></audio>
        </div>
    </main>
    <section class = "bg-blue-400"></section>
    <footer class = "bg-green-800"></footer>
</body>
</html>
